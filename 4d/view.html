<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>4D model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>[hidden]{display:none!important}</style>
<style>
/* Layout: full-height app — header strip / [schedule | 3D viewport | inspector] / timeline dock. Mech-drawing slate palette, system colours carry meaning. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel-2:#f5f7f9; --line:#d5dbe2; --fg:#16202b; --muted:#5b6876;
  --accent:#d9771c; --accent-2:#1f6fd1; --ok:#2f8f5b; --warn:#c98a12; --crit:#c8372d;
  --vp:#dfe5eb; --bar:#9fb0c2; --bar-ip:#d9771c; --bar-cp:#6d8aa6; --sel:rgba(217,119,28,.14);
  --f-ui:"Archivo","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --panel:#151e2a; --panel-2:#1a2533; --line:#283546; --fg:#e4eaf1; --muted:#8d9bab;
  --accent:#f0912f; --accent-2:#5fa2ff; --ok:#4fbf82; --warn:#e2ac3c; --crit:#f0645a;
  --vp:#0b1119; --bar:#43546a; --bar-ip:#f0912f; --bar-cp:#5d7896; --sel:rgba(240,145,47,.16); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --panel:#151e2a; --panel-2:#1a2533; --line:#283546; --fg:#e4eaf1; --muted:#8d9bab;
  --accent:#f0912f; --accent-2:#5fa2ff; --ok:#4fbf82; --warn:#e2ac3c; --crit:#f0645a;
  --vp:#0b1119; --bar:#43546a; --bar-ip:#f0912f; --bar-cp:#5d7896; --sel:rgba(240,145,47,.16); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13px;overflow:hidden}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:340px 1fr 310px;grid-template-areas:"hd hd hd" "lp vp rp" "tl tl tl";padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
header{grid-area:hd;display:flex;align-items:center;gap:18px;padding:8px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;min-width:0}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-stretch:80%;font-weight:750;font-size:17px;letter-spacing:.01em;text-wrap:balance}
.brand span{color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.kpis{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;padding:4px 12px;border-left:1px solid var(--line);min-width:92px}
.kpi small{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
.kpi strong{font-family:var(--f-mono);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi.date strong{color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:5px 9px;cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
aside{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
#lp{grid-area:lp;border-right:1px solid var(--line)}
#rp{grid-area:rp;border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:9px 6px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{flex:1;overflow:auto;min-height:0}
.toolbar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:120px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:3px 9px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* gantt */
.g-head{position:sticky;top:0;z-index:2;background:var(--panel);display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}
.g-months{position:relative;height:20px}
.g-months span{position:absolute;top:4px;font-family:var(--f-mono);transform:translateX(2px)}
.g-grp{padding:6px 10px 3px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--panel-2);border-top:1px solid var(--line)}
.g-row{display:grid;grid-template-columns:150px 1fr;align-items:center;min-height:24px;cursor:pointer;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent)}
.g-row:hover{background:var(--panel-2)}
.g-row.sel{background:var(--sel)}
.g-name{padding:2px 6px 2px 10px;overflow:hidden;line-height:1.15}
.g-name code{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);display:block}
.g-name span{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.g-track{position:relative;height:24px}
.g-bar{position:absolute;top:8px;height:8px;border-radius:2px;background:var(--bar)}
.g-bar.ip{background:var(--bar-ip)}
.g-bar.cp{background:var(--bar-cp)}
.g-bar.crit{box-shadow:inset 0 -2px 0 var(--crit)}
.g-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px;opacity:.9}
.g-ms{position:absolute;top:6px;width:10px;height:10px;transform:translateX(-5px) rotate(45deg);background:var(--fg)}
.g-now{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--accent);pointer-events:none;z-index:3}
.g-today{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--muted);pointer-events:none;z-index:1}
.g-body{position:relative}
/* viewport */
#vp{grid-area:vp;position:relative;background:var(--vp);min-width:0;min-height:0;overflow:hidden}
#vp canvas{display:block;width:100%;height:100%;touch-action:none}
.views{position:absolute;top:10px;left:10px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.views button{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:11.5px;cursor:pointer;backdrop-filter:blur(4px)}
.views button:hover{border-color:var(--accent)}
.colormode{position:absolute;top:10px;right:10px;display:flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11.5px}
.colormode select{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
.legend{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:11px;display:grid;grid-template-columns:auto auto;gap:3px 12px;max-width:calc(100% - 20px)}
.legend div{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sw{width:14px;height:6px;border-radius:2px;display:inline-block;flex:none}
.banner{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none}
.banner div{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:5px;padding:4px 9px;font-size:11.5px}
.banner div.test{border-left-color:#19b5c9}
.banner div.flush{border-left-color:var(--ok)}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:11.5px;max-width:280px;display:none;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tip code{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono)}
/* inspector */
.sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec h2{margin:0 0 4px;font-size:15px;font-stretch:85%;font-weight:700;text-wrap:balance}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:11.5px;word-break:break-word;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;color:#fff}
.pill.ns{background:var(--muted)}.pill.ip{background:var(--accent)}.pill.cp{background:var(--ok)}.pill.crit{background:var(--crit)}
.link{color:var(--accent-2);cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0;font-family:var(--f-mono);font-size:11.5px}
.layer{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
.layer input{accent-color:var(--accent)}
.areacard{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.areacard:last-child{border-bottom:0}
.areacard b{font-size:20px;font-stretch:75%;font-weight:800;width:26px}
.meter{height:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent-2)}
.small{font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:12px;line-height:1.5}
/* timeline */
#tl{grid-area:tl;border-top:1px solid var(--line);background:var(--panel);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.ctrls{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ctrls button{border:1px solid var(--line);background:var(--panel-2);border-radius:5px;min-width:30px;height:28px;cursor:pointer;font-family:var(--f-mono);font-size:12px;padding:0 7px}
.ctrls button.play{background:var(--accent);border-color:var(--accent);color:#fff;min-width:64px;font-weight:600}
.tlkey{display:flex;gap:10px;flex-wrap:wrap;width:100%;font-size:10.5px;color:var(--muted);margin-top:2px}.tlkey span{display:flex;align-items:center;gap:4px}
.ctrls{max-width:520px}
.ctrls select{height:28px;border:1px solid var(--line);background:var(--panel-2);border-radius:5px}
#tlc{width:100%;height:86px;display:block;cursor:ew-resize;touch-action:none}
@media (max-width:1100px){.app{grid-template-columns:290px 1fr 270px}}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto 58vh auto auto auto;grid-template-areas:"hd" "vp" "tl" "lp" "rp"}
  #lp,#rp{border:0;border-top:1px solid var(--line);max-height:70vh}
  #tl{grid-template-columns:1fr}
  .kpis{margin-left:0}
  .legend{display:none}
  .colormode{top:auto;bottom:10px;left:10px;right:auto}
  .banner{top:auto;bottom:48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<style>
.kpi{min-width:0;padding:4px 10px}
.kpi strong{font-size:15px}
header{flex-wrap:nowrap}
@media (max-width:1300px){header{flex-wrap:wrap}}
.brand{flex:0 1 auto}
.brand a{color:var(--accent-2);font-size:11.5px;text-decoration:none;font-family:var(--f-mono)}
.brand a:hover{text-decoration:underline}
.scen{display:flex;flex-direction:column;gap:2px;min-width:0}
.scen small{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
.scen select{max-width:280px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-weight:600}
.kpi.warn strong{color:var(--crit)}
.kpi.good strong{color:var(--ok)}
.g-base{position:absolute;top:18px;height:3px;background:var(--muted);opacity:.55;border-radius:1px}
.g-bar.frag{background:#8a5cd0}
.g-bar.frag.cp,.g-bar.frag.ip{background:#6d3fc0}
.scard{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:0 0 8px;cursor:pointer;background:var(--panel)}
.scard:hover{border-color:var(--accent)}
.scard.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.scard b{display:block;font-size:13px;margin-bottom:3px}
.scard .row{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.scard .late{color:var(--crit);font-weight:600}.scard .early{color:var(--ok);font-weight:600}
.scard p{margin:5px 0 0;font-size:11.5px;color:var(--muted);line-height:1.45}
#cntc{width:100%;height:110px;display:block}
.banner div.bad{border-left-color:var(--crit)}
.banner div.out{border-left-color:#59606b}
.views button.xer{border-color:var(--accent-2);color:var(--accent-2)}
body.thumb header,body.thumb #lp,body.thumb #rp,body.thumb #tl,body.thumb .views,body.thumb .colormode,body.thumb .legend,body.thumb .banner{display:none!important}
body.thumb .app{grid-template-columns:1fr;grid-template-rows:1fr;grid-template-areas:"vp"}
@media (max-width:820px){
  .views{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .views button{flex:none}
  .scen select{max-width:100%}
  header{gap:10px}
  .kpi{min-width:0;padding:3px 8px}
  .colormode{flex-wrap:wrap;right:10px}
  header{position:relative;padding:8px 12px!important}
  #hSub{display:none}
  .brand b{font-size:15px;padding-right:64px}
  #themeBtn{position:absolute;top:8px;right:12px;padding:3px 8px;font-size:12px}
  .kpis{display:grid!important;grid-template-columns:repeat(3,1fr);gap:4px 0;width:100%}
  .kpi{border-left:0!important;padding:2px 4px!important}
  .kpi small{font-size:9.5px;letter-spacing:.04em}
  .kpi strong{font-size:13px!important}
  #kCntBox{grid-column:span 2}
  .banner{top:46px!important;bottom:auto!important}
  .banner div:nth-child(n+2){display:none}
  .colormode select{max-width:150px!important}
  .kpi strong{font-size:14px}
}
</style>
<div class="app">
<header>
  <div class="brand"><a href="./">← 4D gallery</a><b id="hTitle">Loading…</b><span id="hSub"></span></div>
  <div class="kpis">
    <div class="kpi date"><small>Model date</small><strong id="kDate">—</strong></div>
    <div class="kpi"><small>Planned complete</small><strong id="kPct">—</strong></div>
    <div class="kpi"><small>Elements installed</small><strong id="kEl">—</strong></div>
    <div class="kpi"><small>Activities done / active</small><strong id="kAct">—</strong></div>
    <div class="kpi" id="kCntBox" hidden><small id="kCntL">—</small><strong id="kCnt">—</strong></div>
    <div class="kpi" id="kFinBox"><small>Finish</small><strong id="kFin">—</strong></div>
  </div>
  <button class="iconbtn" id="themeBtn" title="Switch light / dark">Theme</button>
</header>

<aside id="lp">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="sched">Schedule</button>
    <button role="tab" aria-selected="false" data-tab="look">Look-ahead</button>
  </div>
  <div class="toolbar" id="schedTools">
    <input type="search" id="q" placeholder="Filter activity name or ID">
    <button class="chip" id="fCrit" aria-pressed="false">Float ≤ 0</button>
    <button class="chip" id="fActive" aria-pressed="false">Active now</button>
  </div>
  <div class="pane" id="sched"></div>
  <div class="pane" id="look" hidden></div>
</aside>

<main id="vp">
  <div class="loading" id="loading">Loading model…</div>
  <div class="views" id="views"></div>
  <div class="colormode"><label for="scenSel">Scenario</label><select id="scenSel" style="max-width:230px;font-weight:600"></select><label for="cmode">Colour by</label>
    <select id="cmode"><option value="sys">System</option><option value="status">Status</option><option value="float">Total float</option><option value="wbs">WBS</option><option value="var">Variance vs baseline</option></select>
  </div>
  <div class="legend" id="legend"></div>
  <div class="banner" id="banner"></div>
  <div id="tip"></div>
</main>

<aside id="rp">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="insp">Inspector</button>
    <button role="tab" aria-selected="false" data-tab="scens">Scenarios</button>
    <button role="tab" aria-selected="false" data-tab="layers">Layers</button>
  </div>
  <div class="pane" id="insp"></div>
  <div class="pane" id="scens" hidden></div>
  <div class="pane" id="layers" hidden></div>
</aside>

<section id="tl">
  <div class="ctrls">
    <button id="bStart" title="Project start">|◀</button>
    <button id="bWkB" title="Back one week">−7d</button>
    <button id="bDayB" title="Back one day">−1d</button>
    <button id="bPlay" class="play">Play</button>
    <button id="bDayF" title="Forward one day">+1d</button>
    <button id="bWkF" title="Forward one week">+7d</button>
    <button id="bEnd" title="Project finish">▶|</button>
    <button id="bToday" title="Jump to the data date">Data date</button>
    <select id="speed" title="Playback speed"><option value="3">3 days/s</option><option value="7" selected>1 wk/s</option><option value="14">2 wk/s</option><option value="30">1 mo/s</option></select>
    <div class="tlkey"><span><i class="sw" style="background:var(--bar)"></i>Crew per day</span><span><i class="sw" style="background:var(--accent-2)"></i>Planned % complete</span><span id="tlBase"><i class="sw" style="background:var(--muted)"></i>Baseline curve</span><span>◆ Milestone</span><span id="tlCnt" hidden><i class="sw" style="background:var(--crit)"></i>Below minimum</span></div>
  </div>
  <canvas id="tlc" aria-label="Project timeline: drag to scrub the model date"></canvas>
</section>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from './lib/OrbitControls.js';

const $=s=>document.querySelector(s);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const Q=new URLSearchParams(location.search);
if(Q.get('thumb'))document.body.classList.add('thumb');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MID=Q.get('m')||'dc-12mw';
const M=await (await fetch('models/'+MID+'.json')).json();
document.title=M.title+' · 4D model';
$('#hTitle').textContent=M.title;
$('#hSub').textContent=`${M.sector} · ${M.E.length.toLocaleString()} model elements · ${M.nacts} activities · ${M.wd}-day week`;

/* ---------------- calendar ---------------- */
const H=3600e3, D=24*H;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmt=t=>{const d=new Date(t);return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`};
const fmtS=t=>{const d=new Date(t);return `${String(d.getUTCDate()).padStart(2,'0')}-${MON[d.getUTCMonth()]}-${String(d.getUTCFullYear()).slice(2)}`};
const [Y0,M0,D0]=M.start.split('-').map(Number);
const P0=Date.UTC(Y0,M0-1,D0);
const isWork=day=>{const w=new Date(day).getUTCDay();return M.wd===7?true:M.wd===6?w!==0:(w!==0&&w!==6)};
const CAL0=P0-120*D, NCAL=3000; const WPRE=new Float64Array(NCAL+1);
for(let i=0;i<NCAL;i++)WPRE[i+1]=WPRE[i]+(isWork(CAL0+i*D)?1:0);
function hrsTo(t){let i=Math.floor((t-CAL0)/D);if(i<0)return 0;if(i>=NCAL)i=NCAL-1;const day=CAL0+i*D;let h=WPRE[i]*10;if(isWork(day))h+=Math.min(10,Math.max(0,(t-day-7*H)/H));return h}
const workHrs=(a,b)=>b>a?hrsTo(b)-hrsTo(a):0;
function prog(a,t){if(!a)return 0;if(a.mile)return t>=a.S?1:0;if(t<=a.S)return 0;if(t>=a.F)return 1;return Math.min(1,workHrs(a.S,t)/a.WH)}

$('#views').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(b)setView(b.dataset.v)});

/* ---------------- picking ---------------- */
const ray=new THREE.Raycaster();const mouse=new THREE.Vector2();
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect();mouse.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(meshes.filter(m=>m.visible&&m.material.opacity>.2),false);
  for(const h of hits){const g=h.object.geometry;const eid=g.attributes.aEid.getX(h.face.a);if(eid<0)continue;
    const u=h.object.material.userData.u;const q=g.attributes.aSeq.getX(h.face.a);if(u.uRev.value<.5?q>u.uProg.value:q<=u.uProg.value)continue;
    if(focusAct>=0&&!(EVS[ELS[eid].sig]&&EVS[ELS[eid].sig].codes.has(ACTS[focusAct].c)))continue;
    return eid}
  return -1;
}
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved>5)return;
  const i=pick(e);if(i>=0)selectEl(i);else{selEl=-1;focusAct=-1;highlight(null);document.querySelectorAll('.g-row').forEach(r=>r.classList.remove('sel'));applyState();renderInspector()}});
let lastHover=0;const tip=$('#tip');
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.buttons)return;const now=performance.now();if(now-lastHover<70)return;lastHover=now;
  const i=pick(e);if(i<0){tip.style.display='none';renderer.domElement.style.cursor='';return}
  const el=ELS[i];const E=EVS[el.sig];const a=E&&E.inst;const r=vp.getBoundingClientRect();
  tip.innerHTML=`${esc(el.n)}<br><code>${a?esc(a.c)+' · '+fmtS(a.S)+' → '+fmtS(a.F):'Existing / context'}</code>`;
  tip.style.display='block';tip.style.left=Math.min(e.clientX-r.left+14,r.width-290)+'px';tip.style.top=(e.clientY-r.top+14)+'px';renderer.domElement.style.cursor='pointer'});
renderer.domElement.addEventListener('pointerleave',()=>tip.style.display='none');

/* ---------------- timeline canvas ---------------- */
const tlc=$('#tlc');const tctx=tlc.getContext('2d');
let DAYS,crewDay,curve,bcurve,maxCrew,MILES,CNTBAD;
function curveOf(L){const wk=L.filter(a=>!a.mile);const tot=wk.reduce((s,a)=>s+a.WH,0);return DAYS.map(d=>{let w=0;for(const a of wk)w+=prog(a,d+17*H)*a.WH;return w/tot})}
function buildTL(){
  DAYS=[];for(let d=Math.floor(T0/D)*D;d<=T1;d+=D)DAYS.push(d);
  crewDay=DAYS.map(d=>crewAt(d+12*H));curve=curveOf(ACTS);bcurve=BASE?curveOf(BASE):null;
  maxCrew=Math.max(...crewDay,1);MILES=ACTS.filter(a=>a.mile);
  CNTBAD=null;$('#tlCnt').hidden=!CNT;
  if(CNT){CNTS=[];let last=-1;for(const d of DAYS){const v=counterAt(CNT,d+12*H);if(v!==last){CNTS.push([d,v]);last=v}}CNTBAD=DAYS.map(d=>counterAt(CNT,d+12*H)<CNT.min)}
}
function drawTL(){
  if(!DAYS)return;const dpr=Math.min(devicePixelRatio,2);const w=tlc.clientWidth,h=tlc.clientHeight;if(!w)return;if(tlc.width!==w*dpr||tlc.height!==h*dpr){tlc.width=w*dpr;tlc.height=h*dpr}
  tctx.setTransform(dpr,0,0,dpr,0,0);tctx.clearRect(0,0,w,h);
  const fg=css('--fg'),mu=css('--muted'),ln=css('--line'),ac=css('--accent'),a2=css('--accent-2'),bar=css('--bar');
  const X=t=>(t-T0)/(T1-T0)*w;const top=14,bot=h-16,ch=bot-top;
  if(DAYS.length<400){tctx.fillStyle=ln;DAYS.forEach(d=>{if(!isWork(d))tctx.fillRect(X(d),top,Math.max(1,X(d+D)-X(d)),ch)})}
  if(CNTBAD){tctx.fillStyle='rgba(200,55,45,.22)';DAYS.forEach((d,i)=>{if(CNTBAD[i])tctx.fillRect(X(d),top,Math.max(1,X(d+D)-X(d)),ch)})}
  tctx.fillStyle=bar;DAYS.forEach((d,i)=>{const v=crewDay[i]/maxCrew*ch*.92;tctx.fillRect(X(d)+.5,bot-v,Math.max(1,X(d+D)-X(d)-(DAYS.length<400?1:0)),v)});
  if(bcurve){tctx.strokeStyle=mu;tctx.setLineDash([5,4]);tctx.lineWidth=1.5;tctx.beginPath();DAYS.forEach((d,i)=>{const x=X(d+17*H),y=bot-bcurve[i]*ch;i?tctx.lineTo(x,y):tctx.moveTo(x,y)});tctx.stroke();tctx.setLineDash([])}
  tctx.strokeStyle=a2;tctx.lineWidth=2;tctx.beginPath();DAYS.forEach((d,i)=>{const x=X(d+17*H),y=bot-curve[i]*ch;i?tctx.lineTo(x,y):tctx.moveTo(x,y)});tctx.stroke();
  tctx.font='10.5px "IBM Plex Mono", monospace';tctx.fillStyle=mu;tctx.textBaseline='top';
  {const months=[];let d=new Date(T0);let m=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1);while(m<T1){if(m>=T0)months.push(m);const x=new Date(m);m=Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,1)}
   const step=Math.max(1,Math.ceil(months.length/(w/70)));months.forEach((m,i)=>{tctx.fillRect(X(m),0,1,i%step?6:h);if(i%step===0)tctx.fillText(MON[new Date(m).getUTCMonth()]+' ’'+String(new Date(m).getUTCFullYear()).slice(2),X(m)+4,1)})}
  MILES.forEach(a=>{const x=X(a.S);tctx.fillStyle=a.fr?'#8a5cd0':fg;tctx.save();tctx.translate(x,bot+7);tctx.rotate(Math.PI/4);tctx.fillRect(-3.5,-3.5,7,7);tctx.restore()});
  if(TODAY){tctx.strokeStyle=mu;tctx.setLineDash([3,3]);tctx.lineWidth=1;tctx.beginPath();tctx.moveTo(X(TODAY),top);tctx.lineTo(X(TODAY),bot);tctx.stroke();tctx.setLineDash([]);tctx.fillStyle=mu;tctx.fillText('data date',X(TODAY)+3,top+1)}
  const xn=X(NOW);tctx.fillStyle=ac;tctx.fillRect(xn-1,top-4,2,ch+8);tctx.beginPath();tctx.moveTo(xn-6,top-6);tctx.lineTo(xn+6,top-6);tctx.lineTo(xn,top+2);tctx.fill();
}
function tlSet(ev){const r=tlc.getBoundingClientRect();const f=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));NOW=T0+f*(T1-T0);update()}
let scrub=false;
tlc.addEventListener('pointerdown',e=>{scrub=true;tlc.setPointerCapture(e.pointerId);tlSet(e)});
tlc.addEventListener('pointermove',e=>{if(scrub)tlSet(e)});
tlc.addEventListener('pointerup',()=>scrub=false);

/* ---------------- playback ---------------- */
let playing=false,lastT=0;
$('#bPlay').onclick=()=>{playing=!playing;$('#bPlay').textContent=playing?'Pause':'Play';if(playing&&NOW>=T1-D)NOW=T0;lastT=performance.now()};
const step=d=>{NOW=Math.min(T1,Math.max(T0,NOW+d*D));update()};
$('#bDayB').onclick=()=>step(-1);$('#bDayF').onclick=()=>step(1);$('#bWkB').onclick=()=>step(-7);$('#bWkF').onclick=()=>step(7);
$('#bStart').onclick=()=>{NOW=T_START;update()};$('#bEnd').onclick=()=>{NOW=T_END+D;update()};$('#bToday').onclick=()=>{if(TODAY){NOW=TODAY;update()}};
addEventListener('keydown',e=>{if(e.target.closest('input,select'))return;if(e.code==='Space'){e.preventDefault();$('#bPlay').click()}if(e.key==='ArrowRight')step(e.shiftKey?7:1);if(e.key==='ArrowLeft')step(e.shiftKey?-7:-1)});

$('#themeBtn').onclick=()=>{const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';themeChanged()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged);
function themeChanged(){scene.background=new THREE.Color(css('--vp'));drawTL();drawCnt()}

/* ---------------- main loop ---------------- */
let lastPanel=0;
function refreshPanels(){updateKPIs();updateGanttBars();positionGanttLines();renderInspector();if(!$('#look').hidden)renderLook();drawCnt()}
function update(){applyState();drawTL();refreshPanels();if(filt.active)renderSchedule()}
function resize(){const w=vp.clientWidth,h=vp.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix();drawTL();positionGanttLines()}
new ResizeObserver(resize).observe(vp);new ResizeObserver(()=>{drawTL();positionGanttLines()}).observe(tlc);
function loop(t){
  requestAnimationFrame(loop);
  if(playing){const dt=Math.min(.1,(t-lastT)/1000);lastT=t;NOW+=dt*(+$('#speed').value)*D;if(NOW>=T1){NOW=T1;playing=false;$('#bPlay').textContent='Play'}
    applyState();drawTL();if(t-lastPanel>300){lastPanel=t;refreshPanels()}}
  pulse=t/1000;
  if(!playing)applyGlowOnly();
  if(fly){const k=Math.min(1,(t-fly.s)/fly.ms);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.t0,fly.t1,e);if(k>=1)fly=null}
  controls.update();renderer.render(scene,camera);
}
function applyGlowOnly(){const k=.18+.14*Math.sin(pulse*5);for(const m of meshes){if(!m.visible)continue;const u=m.material.userData.u;const si=ELS[m.userData.ids[0]].sig;const inf=memo.get(si);if(!inf)continue;
  if(layers.glow&&(inf.st==='prog'||inf.st==='demo')&&!(focusAct>=0))u.uGlow.value.setRGB(k,k*.55,k*.1);if(inf.st==='cx'&&cmode==='sys')u.uTintMix.value=.35+.25*Math.sin(pulse*4)}}

renderLayers();themeChanged();
setScenario(SC);
if(Q.get('crit')){cmode='float';$('#cmode').value='float';renderLegend();applyState()}
resize();{const[p,t]=isoPose();camera.position.copy(p);controls.target.copy(t)}
$('#loading').remove();requestAnimationFrame(loop);
window.__4d={renderer,scene,camera,M,get ACTS(){return ACTS},ELS,setNow:t=>{NOW=t;update()},setFrac:f=>{NOW=T0+f*(T1-T0);update()},setView,selectAct,setScenario,pickAt:(x,y)=>pick({clientX:x,clientY:y}),selectEl,get NOW(){return NOW}};
window.__ready=true;
</script>
</body></html>
